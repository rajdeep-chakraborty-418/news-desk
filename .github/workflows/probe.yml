name: Probe (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the Asian Age feed
        run: |
          A="Mozilla/5.0"
          curl -sL -m 30 -A "$A" https://www.asianage.com/google_feeds.xml -o /tmp/f.xml
          echo "bytes: $(wc -c < /tmp/f.xml)  items: $(grep -c '<item>' /tmp/f.xml)"
          echo "== first item"; python3 - <<'PY'
          import re
          s = open('/tmp/f.xml', encoding='utf-8', errors='replace').read()
          items = re.findall(r'<item>.*?</item>', s, re.S)
          print(items[0][:1800] if items else s[:1500])
          print("== links / categories of the first 40 items")
          for it in items[:40]:
              link = re.search(r'<link>(.*?)</link>', it, re.S)
              cats = re.findall(r'<category>(.*?)</category>', it, re.S)
              print((link.group(1).strip() if link else '?')[:110], '|', [c.strip()[:30] for c in cats])
          PY
          for p in sports/google_feeds.xml world/google_feeds.xml india/google_feeds.xml entertainment/google_feeds.xml business/google_feeds.xml technology/google_feeds.xml science/google_feeds.xml life/google_feeds.xml nation/google_feeds.xml; do
            printf "%s " "$p"; curl -sL -m 20 -A "$A" -o /tmp/x -w "%{http_code} %{content_type} " "https://www.asianage.com/$p"; echo "items: $(grep -c '<item>' /tmp/x)"
          done
