name: Update news and deploy

on:
  schedule:
    # GitHub often delays or skips scheduled runs, so try every hour; the "gate" step below
    # only lets a run proceed if the last deployment is at least ~100 minutes old (about every 2 hours).
    - cron: "17 * * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab (the page's Refresh button uses this)
    inputs:
      hours:
        description: "Only include stories from the last N hours (6, 12, 24, 72, 168, 720 or 2160)"
        required: false
        default: "24"
      count:
        description: "Stories to keep per section (200, 300, 400, 500 or 1000)"
        required: false
        default: "300"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Gate (scheduled runs only refresh about every 2 hours)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at' || true)
          if [ -z "$last" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 60 ))
          echo "Last deployment was $age minutes ago"
          if [ "$age" -ge 100 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Too soon, skipping this run."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Build newspaper homepage list
        if: steps.gate.outputs.go == 'true'
        run: python3 homepages.py
      - name: Fetch latest headlines
        if: steps.gate.outputs.go == 'true'
        env:
          WINDOW_HOURS: ${{ github.event.inputs.hours || '24' }}
          ARTICLE_COUNT: ${{ github.event.inputs.count || '300' }}
        run: python3 fetch_news.py
      - name: Image check (diagnostic only)
        if: steps.gate.outputs.go == 'true' && github.event_name != 'schedule'
        continue-on-error: true
        run: python3 check_images.py
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: site
      - id: deployment
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
