<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC News Desk — India, World, Sports, Entertainment, Defence &amp; Geopolitics</title>
<meta name="description" content="Headlines from newspapers across the world, refreshed every 2 hours.">
<meta name="referrer" content="no-referrer">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1b1b1f; --muted: #6a6a73; --line: #e3e0d8; --accent: #b3261e;
    --c-india: #c2570c; --c-world: #2a4d8f; --c-sports: #1b6e5a; --c-entertainment: #9b2f7a;
    --c-defence: #4a5a2a; --c-geopolitics: #8a2d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --card: #1c1c21; --ink: #ecebe6; --muted: #9a9aa4; --line: #2c2c33; --accent: #ff6b5e;
      --c-india: #ff9a4d; --c-world: #7ea3f0; --c-sports: #4cc3a4; --c-entertainment: #e27cc0;
      --c-defence: #9fbf5f; --c-geopolitics: #f08a8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 Georgia, "Times New Roman", serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 24px 0 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; border-bottom: 3px double var(--ink); }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .updated { color: var(--muted); font: 13px system-ui, sans-serif; margin-left: auto; }
  .demo { background: #fff3cd; color: #5b4500; font: 14px system-ui, sans-serif; padding: 10px 14px; border-radius: 8px; margin-top: 14px; display: none; }
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line);
              font-family: system-ui, sans-serif; display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button, select { font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 999px; }
  select { padding-right: 10px; max-width: 220px; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs button { font-weight: 600; font-size: 15px; white-space: nowrap; border-bottom-width: 3px; }
  .tabs button[aria-pressed="true"] { background: var(--tabc, var(--ink)); border-color: var(--tabc, var(--ink)); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  input[type=search] { font: 14px system-ui, sans-serif; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 190px; margin-left: auto; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  #grid { margin-top: 18px; }
  .top { margin-top: 18px; }
  .top h3 { margin: 0 0 8px; font: 700 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  a.tile { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line);
           border-radius: 10px; overflow: hidden; transition: transform .12s, box-shadow .12s; }
  a.tile:hover, a.tile:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.14); outline: none; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--line); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 700 34px system-ui, sans-serif; color: #fff; background: var(--tc, #555); opacity: .9; }
  .badge { position: absolute; left: 8px; top: 8px; font: 700 11px system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--tc, #555); color: #fff; }
  .body { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .meta { display: flex; justify-content: space-between; gap: 8px; font: 12px system-ui, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tile h2 { margin: 0; font-size: 18px; line-height: 1.28; }
  .tile.lead h2 { font-size: 19px; }
  .tile p { margin: 0; color: var(--muted); font-size: 14px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font: 12px system-ui, sans-serif; color: var(--muted); }
  .src { font-weight: 700; color: var(--ink); }
  .pri { color: var(--accent); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-family: system-ui, sans-serif; grid-column: 1 / -1; }
  .more { display: block; margin: 22px auto 0; padding: 10px 26px; }
  footer { margin-top: 36px; color: var(--muted); font: 13px system-ui, sans-serif; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RC News <span>Desk</span></h1>
    <div class="updated" id="updated">Loading…</div>
  </header>
  <div class="demo" id="demo">Sample data for preview. Real headlines appear after the first update runs on your host.</div>

  <div class="controls">
    <div class="tabs" id="tabs" role="group" aria-label="Section"></div>
    <div class="row">
      <div class="chips" id="chips" role="group" aria-label="Continent"></div>
      <select id="country" aria-label="Country"></select>
      <label class="toggle"><input type="checkbox" id="primaryOnly"> Primary sources only</label>
      <input type="search" id="q" placeholder="Search headlines…" aria-label="Search headlines">
    </div>
  </div>

  <section class="top" id="top" hidden>
    <h3 id="toph">Top stories: latest from each continent</h3>
    <div class="grid" id="topgrid"></div>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>
  <button class="more" id="more" hidden>Show more stories</button>
  <noscript><p class="empty">Please enable JavaScript to see the headlines.</p></noscript>

  <footer>Headlines, images and links belong to their respective newspapers. Click a tile to read the original story. Refreshed every 2 hours.</footer>
</div>

<script>
const SECTIONS = [
  ["india", "Indian News"], ["world", "World News"], ["sports", "Sports News"],
  ["entertainment", "Entertainment News"], ["defence", "Defence News"], ["geopolitics", "Geo Politics News"]
];
const CONTINENTS = ["All", "Asia", "Europe", "Africa", "North America", "South America", "Oceania"];
const PRIMARY_BOOST_MS = 6 * 3600 * 1000;   // primary-source stories rank as if 6 hours newer
const PAGE = 60;
const state = { section: "india", continent: "All", country: "All", primaryOnly: false, q: "", items: [], shown: PAGE };
const $ = (id) => document.getElementById(id);

const color = (sec) => `var(--c-${sec})`;
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}
const score = (i) => new Date(i.published).getTime() + (i.primary ? PRIMARY_BOOST_MS : 0);

function bySection() {
  const q = state.q.trim().toLowerCase();
  return state.items.filter(i =>
    i.sections.includes(state.section) &&
    (!state.primaryOnly || i.primary) &&
    (!q || (i.title + " " + i.summary + " " + i.source + " " + i.country).toLowerCase().includes(q)));
}

function makeTile(i, lead) {
  const a = document.createElement("a");
  a.className = "tile" + (lead ? " lead" : "");
  a.href = i.link; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.style.setProperty("--tc", color(state.section));

  const thumb = document.createElement("div"); thumb.className = "thumb";
  const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = (i.source || "?").charAt(0);
  thumb.append(ph);
  if (i.image && i.image.startsWith("https://")) {
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = ""; img.referrerPolicy = "no-referrer"; img.src = i.image;
    img.onerror = () => img.remove();
    thumb.append(img);
  }
  const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = i.country;
  thumb.append(badge);

  const body = document.createElement("div"); body.className = "body";
  const meta = document.createElement("div"); meta.className = "meta";
  const c = document.createElement("span"); c.textContent = i.continent;
  const t = document.createElement("span"); t.textContent = ago(i.published);
  meta.append(c, t);
  const h = document.createElement("h2"); h.textContent = i.title;
  body.append(meta, h);
  if (i.summary) { const p = document.createElement("p"); p.textContent = i.summary; body.append(p); }
  const f = document.createElement("div"); f.className = "foot";
  const s = document.createElement("span"); s.className = "src"; s.textContent = i.source;
  const r = document.createElement("span");
  if (i.primary) { const pm = document.createElement("span"); pm.className = "pri"; pm.textContent = "● Primary  "; r.append(pm); }
  r.append("Read ↗");
  f.append(s, r); body.append(f);
  a.append(thumb, body);
  return a;
}

function renderCountries(list) {
  const sel = $("country");
  const inCont = list.filter(i => state.continent === "All" || i.continent === state.continent);
  const counts = {};
  for (const i of inCont) counts[i.country] = (counts[i.country] || 0) + 1;
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  if (state.country !== "All" && !counts[state.country]) state.country = "All";
  sel.replaceChildren(new Option(`All countries (${inCont.length})`, "All"));
  for (const n of names) sel.append(new Option(`${n} (${counts[n]})`, n));
  sel.value = state.country;
}

function renderTop(list) {
  const top = $("top"), tg = $("topgrid");
  tg.replaceChildren();
  const show = state.continent === "All" && state.country === "All" && !state.q.trim();
  const picks = [];
  if (show) {
    for (const c of CONTINENTS.slice(1)) {
      const best = list.filter(i => i.continent === c).sort((a, b) => score(b) - score(a))[0];
      if (best) picks.push(best);
    }
  }
  top.hidden = picks.length < 2;
  for (const i of picks) tg.append(makeTile(i, true));
}

function render() {
  const base = bySection();
  renderCountries(base);
  renderTop(base);
  const list = base.filter(i =>
    (state.continent === "All" || i.continent === state.continent) &&
    (state.country === "All" || i.country === state.country)
  ).sort((a, b) => score(b) - score(a));

  const grid = $("grid");
  grid.replaceChildren();
  if (!list.length) {
    const d = document.createElement("div"); d.className = "empty";
    d.textContent = "No stories match this filter right now.";
    grid.append(d);
  }
  for (const i of list.slice(0, state.shown)) grid.append(makeTile(i, false));
  $("more").hidden = list.length <= state.shown;
  $("more").textContent = `Show more stories (${list.length - state.shown} left)`;
}

function build() {
  const tabs = $("tabs");
  for (const [key, label] of SECTIONS) {
    const b = document.createElement("button");
    b.textContent = label; b.style.setProperty("--tabc", color(key));
    b.setAttribute("aria-pressed", key === state.section);
    b.onclick = () => {
      state.section = key; state.continent = "All"; state.country = "All"; state.shown = PAGE;
      tabs.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("chips").querySelectorAll("button").forEach((x, n) => x.setAttribute("aria-pressed", n === 0));
      render();
    };
    tabs.append(b);
  }
  const chips = $("chips");
  for (const c of CONTINENTS) {
    const b = document.createElement("button");
    b.textContent = c; b.setAttribute("aria-pressed", c === state.continent);
    b.onclick = () => {
      state.continent = c; state.country = "All"; state.shown = PAGE;
      chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      render();
    };
    chips.append(b);
  }
  $("country").onchange = (e) => { state.country = e.target.value; state.shown = PAGE; render(); };
  $("primaryOnly").onchange = (e) => { state.primaryOnly = e.target.checked; state.shown = PAGE; render(); };
  $("q").addEventListener("input", (e) => { state.q = e.target.value; state.shown = PAGE; render(); });
  $("more").onclick = () => { state.shown += PAGE; render(); };
}

async function load() {
  try {
    const res = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    state.items = data.items || [];
    $("demo").style.display = data.demo ? "block" : "none";
    $("updated").textContent = "Updated " + new Date(data.generated_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    render();
  } catch (e) {
    $("updated").textContent = "Could not load headlines";
    $("grid").innerHTML = '<div class="empty">News data is unavailable. If you opened this file directly, serve it with a web server (python3 -m http.server).</div>';
  }
}
build(); load();
setInterval(load, 10 * 60 * 1000);   // re-check for new data every 10 minutes
setInterval(() => { if (state.items.length) render(); }, 5 * 60 * 1000);   // keep "x min ago" fresh
</script>
</body>
</html>
